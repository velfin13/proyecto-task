
services:
  db:
    container_name: mysql
    image: mysql:5.7
    restart: always
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - ./data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - internal

  phpmyadmin:
    container_name: phpmyadmin
    image: phpmyadmin:latest
    restart: always
    depends_on:
      - db
    ports:
      - "8080:80"
    environment:
      - PMA_HOST=mysql
      - PMA_PORT=${MYSQL_PORT}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    networks:
      - internal

  task-ui:
    container_name: task-ui
    image: velfin13/task-ui:1.0.0
    ports:
      - "${UI_WEB_PORT}:80"
    networks:
      - internal
  
  task-backend:
    container_name: task-backend
    depends_on:
      - db
    image: velfin13/task-backend:1.0.0
    ports:
      - "8081:8081"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: ${QUARKUS_DATASOURCE_JDBC_URL}
      QUARKUS_DATASOURCE_USERNAME: ${QUARKUS_DATASOURCE_USERNAME}
      QUARKUS_DATASOURCE_PASSWORD: ${QUARKUS_DATASOURCE_PASSWORD}
      QUARKUS_HTTP_PORT: ${MS_TASK_PORT}
      CORS_ORIGINS: ${CORS_ORIGINS}

    networks:
      - internal

networks:
  internal:
    driver: bridge
